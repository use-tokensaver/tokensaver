name: release

on:
  push:
    branches: [main] # a merged PR: version comes from the Conventional Commits
    tags: ["v*"] # manual escape hatch: version comes from the tag

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # svu and the changelog need full history and tags

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # A tag push already carries its version. A merge to main works it out from
      # the Conventional Commits since the last release; when nothing releasable
      # landed (docs:, chore:, refactor: …) svu returns the current version and
      # this job stops without cutting one.
      #
      # The tag is created here rather than in a separate workflow on purpose: a
      # tag pushed with GITHUB_TOKEN deliberately does not trigger another workflow
      # run, so a split "tag" / "release" pair would silently never release.
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          go install github.com/caarlos0/svu/v3@latest
          svu="$(go env GOPATH)/bin/svu"
          current=$("$svu" current)
          next=$("$svu" next)
          echo "current=$current next=$next"
          if [ "$next" = "$current" ]; then
            echo "Nothing releasable since $current — no feat:/fix: commits."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$next" -m "$next"
          git push origin "$next"
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "version=${next#v}" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@v7
        if: steps.version.outputs.release == 'true'
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

  # Built from the tagged source, not from GoReleaser's binaries, and run even
  # when the Homebrew step above failed: the two publishes don't depend on each
  # other. Pure Go, so the arm64 image is cross-compiled, not emulated.
  docker:
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.release.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest

      - name: Smoke test the pushed image
        run: |
          docker run --rm ghcr.io/${{ github.repository }}:${{ needs.release.outputs.version }} -version \
            | grep -qx "${{ needs.release.outputs.version }}"

  # Lists the release in the official MCP Registry (registry.modelcontextprotocol.io).
  # The registry stores metadata only and points at the ghcr image pushed above;
  # it checks the image's io.modelcontextprotocol.server.name label against
  # server.json, so this must run after the docker job. Auth is GitHub OIDC,
  # which owns the io.github.use-tokensaver/* namespace — no secret needed.
  mcp-registry:
    needs: [release, docker]
    if: ${{ !cancelled() && needs.docker.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      # server.json in git carries the last version by hand; stamp the real one.
      - name: Set the version in server.json
        run: |
          jq --arg v "$VERSION" \
            '.version = $v | .packages[0].identifier = "ghcr.io/use-tokensaver/tokensaver:" + $v' \
            server.json > server.tmp && mv server.tmp server.json

      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
